# Word-by-word highlight. Unsung words use unsung_color; sung words take the speaker's caption_color.
font: Montserrat
bold: true
font_size: {"9:16": 66, "16:9": 48}
outline: 5
shadow: 0
unsung_color: "#FFFFFF"
max_chars_per_line: {"9:16": 18, "16:9": 36}
max_lines: 2
margin_v_pct:
  "9:16": {lower_third: 0.17, center: 0.0, upper_third: 0.10}
  "16:9": {lower_third: 0.10, center: 0.0, upper_third: 0.06}
