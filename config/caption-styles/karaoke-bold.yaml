# Word-by-word highlight. Unsung words use unsung_color; sung words take the speaker's caption_color.
font: Montserrat
bold: true
font_size: {"9:16": 76, "16:9": 54}
outline: 6
shadow: 0
unsung_color: "#FFFFFF"
max_chars_per_line: {"9:16": 22, "16:9": 40}
max_lines: 2
margin_v_pct:
  "9:16": {lower_third: 0.15, center: 0.0, upper_third: 0.12}
  "16:9": {lower_third: 0.08, center: 0.0, upper_third: 0.08}
