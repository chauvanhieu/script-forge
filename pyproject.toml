[project]
name = "storyforge"
version = "0.1.0"
description = "StoryForge production engine scripts"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "mlx-whisper>=0.4.3",
  "Pillow>=10.3",
  "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["scripts"]
